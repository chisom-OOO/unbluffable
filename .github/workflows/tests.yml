name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser-logic suites (Node)
        run: for f in tests/*.cjs; do node "$f"; done
