[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unbluffable"
version = "0.1.0"
description = "Spoken interview practice app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pyyaml>=6,<7",
    "openai>=2,<3",
    "httpx>=0.27,<1.0",
    "websockets>=14,<18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["app*", "engine*", "llm*", "voice*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
